name: 'GitHub AI Workflow Gate'
description: >-
  Deterministic gate for the GitHub-native AI workflow. Validates actor
  identity, strictly parses comment commands, re-reads issue labels from the
  API and performs the frozen label-based state transitions (Phase 1:
  /ai-plan, /approve, /cancel). The protocol is frozen in docs/protocol.md
  (schema 1). AI never participates in authorization decisions.
author: 'github-ai-workflow'

branding:
  icon: 'shield'
  color: 'gray-dark'

inputs:
  github-token:
    description: >-
      GitHub token used by the gate to read issue labels and write workflow
      labels. Defaults to the workflow's own token; the calling workflow must
      grant `permissions: issues: write`.
    required: false
    default: ${{ github.token }}
  trusted-humans:
    description: >-
      Comma-separated GitHub logins treated as Trusted Humans in addition to
      the repository owner (V0 default). Trusted Humans are the only actors
      allowed to run commands: /ai-plan, /approve, /choose, /change, /cancel
      (Phase 1 implements /ai-plan, /approve, /cancel).
    required: false
    default: ''
  trusted-agents:
    description: >-
      Comma-separated GitHub logins treated as Trusted Agents (independent bot
      or GitHub App identities). Trusted Agent is a separate concept from
      Trusted Human and is never allowed to run commands. V0 default: empty.
    required: false
    default: ''

runs:
  using: 'node20'
  main: 'dist/index.js'
