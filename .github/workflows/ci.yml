# CI — verify the GateFlow baseline: types, tests, and that the committed
# dist/ bundles (required by GitHub JavaScript Actions) match the src/ tree.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Rebuild dist/ in memory and byte-compare against the committed bundles.
      - name: Check dist/ is in sync with src/
        run: npm run check:dist

      # Belt and braces: after `npm run build` rewrote dist/ on disk, a leftover
      # diff means dist/ was not committed (or check:dist was bypassed).
      - name: Ensure dist/ has no uncommitted changes
        run: git diff --exit-code dist
